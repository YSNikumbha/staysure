spring:
  application:
    name: staysure-backend
  datasource:
    url: jdbc:mysql://localhost:3306/staysure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: staysure_user
    password: StaySure@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

app:
  jwt:
    secret: StaySurePGDiscoveryAndManagementPlatformSecretKey2024!
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  upload:
    directory: ./uploads
    max-file-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - application/pdf
  bootstrap:
    super-admin-email: admin@staysure.com
    super-admin-password: admin123
    super-admin-phone: 9999999999
    super-admin-first-name: Super
    super-admin-last-name: Admin

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
