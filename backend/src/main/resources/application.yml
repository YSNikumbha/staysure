spring:
  application:
    name: staysure-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/staysure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - application/pdf
  bootstrap:
    super-admin-email: ${STAYSURE_SUPER_ADMIN_EMAIL:}
    super-admin-password: ${STAYSURE_SUPER_ADMIN_PASSWORD:}
    super-admin-phone: ${STAYSURE_SUPER_ADMIN_PHONE:}
    super-admin-first-name: ${STAYSURE_SUPER_ADMIN_FIRST_NAME:Super}
    super-admin-last-name: ${STAYSURE_SUPER_ADMIN_LAST_NAME:Admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
